name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen

      - name: Compile and Force Build
        run: |
          chmod +x ./make-ios.sh
          # Runs the full compilation pipeline up to the code signing gate
          ./make-ios.sh --ipa || true

      - name: Manual Fallback Package
        run: |
          # 1. Clear out any previous build folders and make a fresh Payload path
          rm -rf build/Payload build/Mush8.ipa
          mkdir -p build/Payload
          
          # 2. Copy the actual .app file from the Xcode build products folder into Payload
          cp -r ios/build/Release-iphoneos/Mush8.app build/Payload/
          
          # 3. Compress into the working IPA
          cd build && zip -r Mush8.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
