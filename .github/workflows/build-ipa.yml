name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen

      - name: Compile and Force Build
        run: |
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa || true

      - name: Manual Fallback Package
        run: |
          mkdir -p build/Payload
          
          # Automatically finds the compiled .app wherever Xcode hid it
          APP_PATH=$(find /Users/runner -name "Mush8.app" -type d -not -path "*/.trash/*" | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Found app bundle at: $APP_PATH"
            cp -r "$APP_PATH" build/Payload/
            cd build && zip -r Mush8.ipa Payload/
          else
            echo "Error: Could not locate Mush8.app anywhere in the runner environment."
            exit 1
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
