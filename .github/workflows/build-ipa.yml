name: Mush8 iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      CARGO_BUILD_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      RUST_BACKTRACE: full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 \
            -name 'Xcode_26*.app' | sort -V | tail -1)

          if [ -z "$XCODE" ]; then
            XCODE="/Applications/Xcode.app"
          fi

          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Install dependencies
        run: |
          brew install cmake pkgconf xcodegen

      - name: Verify environment
        run: |
          xcodebuild -version
          rustc +1.98.1 --version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Prepare update file
        run: |
          set -e

          if [ -f "update.nsp" ]; then
            echo "update.nsp already exists."
          elif [ -f "upd4-0-1.nsp" ]; then
            ln -s "$PWD/upd4-0-1.nsp" update.nsp
          elif [ -f "upd3-0-5.nsp" ]; then
            ln -s "$PWD/upd3-0-5.nsp" update.nsp
          else
            echo "ERROR: No supported update file was found."
            exit 1
          fi

          ls -lh update.nsp
          stat -f "Update size: %z bytes" update.nsp

      - name: Build Mush8 IPA
        run: |
          set -euxo pipefail
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa 2>&1 | tee build-ipa.log

          echo "Checking IPA..."
          test -s build/Mush8.ipa
          unzip -l build/Mush8.ipa | grep 'Payload/Mush8.app'

          echo "Mush8 IPA created successfully!"

      - name: Upload Mush8 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-Build-Logs
          path: build-ipa.log
          if-no-files-found: ignore
          retention-days: 7
