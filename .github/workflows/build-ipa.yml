name: Build Native Mario Kart 8 (Mush8)

on:
  workflow_dispatch:

jobs:
  build-mush8-ipa:
    runs-on: macos-latest
    
    steps:
      # 1. Pull down the official mush8 engine codebase
      - name: Checkout Mush8
        uses: actions/checkout@v4
        with:
          repository: 'c22dev/mush8'
          ref: 'main'

      # 2. Set up the Rust ecosystem
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # 3. Bring in development packages and the Apple Metal shader toolchain
      - name: Install System Dependencies
        run: |
          brew install libarchive cmake pkg-config
          sudo xcodebuild -downloadComponent MetalToolchain || true

      # 4. Reconstruct your encryption keys from SWITCH_KEYS Secret
      - name: Setup Keys
        run: |
          mkdir -p ~/Library/Application\ Support/Ryujinx/system/
          cat << 'EOF' > ~/Library/Application\ Support/Ryujinx/system/prod.keys
          ${{ secrets.SWITCH_KEYS }}
          EOF
          
          if [ ! -s ~/Library/Application\ Support/Ryujinx/system/prod.keys ]; then
            echo "::error:: SWITCH_KEYS is missing or empty! Double check your GitHub Secrets."
            exit 1
          fi

      # 5. Download and extract your raw game zip into the main repository directory
      - name: Fetch and Extract Game Assets
        run: |
          # REPLACE THE LINK BELOW with your actual direct download URL to your zip file
          curl -L -o mk8_dump.zip "https://your-private-storage.com"
          
          # Unzip files right into the repo root where the script looks for them
          unzip -q mk8_dump.zip -d .
          
          # Flatten if your zip created an extra top-level folder container
          if [ -d "mk8_dump" ]; then
            mv mk8_dump/* .
            rm -rf mk8_dump
          fi
          
          # Sanity check: Ensure base files are found
          echo "Verifying raw assets in repo root..."
          ls -F
          
          if [ ! -f "base.nsp" ] || [ ! -f "update.nsp" ] || [ ! -d "Firmware" ]; then
            echo "::error:: Missing vital files! Ensure base.nsp, update.nsp, and Firmware/ are present."
            exit 1
          fi

      # 6. Run the native packaging command optimized for ESign
      - name: Build Unsigned IPA
        run: |
          chmod +x ./make-ios.sh
          # Executes the build. The environment automatically locates base.nsp, update.nsp, and Firmware/
          ./make-ios.sh --ipa || exit 1

      # 7. Rigidly verify the IPA bundle inside the build folder before wrapping up
      - name: Validate Output Payload
        run: |
          if [ ! -f "build/Mush8.ipa" ]; then
            echo "::error:: The compiler finished but build/Mush8.ipa was not generated!"
            exit 1
          fi
          echo "Build successful! Package size details:"
          ls -lh build/

      # 8. Deliver the working, compiled package
      - name: Upload Mush8 App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: working-mush8-ios-build
          path: build/Mush8.ipa
          retention-days: 3
