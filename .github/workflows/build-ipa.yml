name: Mush8 iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      CARGO_BUILD_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      RUST_BACKTRACE: full

    steps:
      - name: Checkout Mush8
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(find /Applications -maxdepth 1 \
            -name 'Xcode_26*.app' | sort -V | tail -1)

          if [ -z "$XCODE" ]; then
            XCODE="/Applications/Xcode.app"
          fi

          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Install dependencies
        run: |
          brew install cmake pkgconf xcodegen

      - name: Verify tools
        run: |
          xcodebuild -version
          rustc +1.98.1 --version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Build Mush8 IPA
        run: |
          set -euxo pipefail
          
          chmod +x ./make-ios.sh
          
          echo "Starting IPA build..."
          ./make-ios.sh --ipa 2>&1 | tee build-ipa.log

          echo "Checking generated files..."
          find build -maxdepth 5 -type f -print || true

          echo "Checking IPA..."
          if [ -s build/Mush8.ipa ]; then
            echo "IPA FOUND!"

          else
            echo "IPA NOT FOUND!"
            exit 1
          fi

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-Build-Logs
          path: build-ipa.log
          if-no-files-found: ignore
          retention-days: 7
