name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen cmake

      - name: Run Official Build Script
        run: |
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa FREE=1 BUNDLE_ID="com.sideload.mush8" || true

      - name: Manual Assembly from Successful Compilation
        run: |
          # 1. Create a clean Payload and app bundle folder layout
          mkdir -p build/Payload/Mush8.app
          
          # 2. Scans your entire project directory for the compiled binaries
          echo "Scanning entire workspace for the executable binaries..."
          find . -type f -name "nxhost" -exec cp {} build/Payload/Mush8.app/Mush8 \;
          find . -type f -name "mush8" -exec cp {} build/Payload/Mush8.app/Mush8 \;
          
          # 3. Create a valid Info.plist configuration file
          cat > "build/Payload/Mush8.app/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Mush8</string>
              <key>CFBundleIdentifier</key>
              <string>com.sideload.mush8</string>
              <key>CFBundleName</key>
              <string>Mush8</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF
          
          # 4. Pull down the essential dynamic project assets and configurations
          cp -r ios-res build/Payload/Mush8.app/ios-res || true
          if [ -d "ios/Mush8/Resources" ]; then
            cp -r ios/Mush8/Resources/* build/Payload/Mush8.app/ || true
          fi
          
          # 5. Compress everything into your final working IPA file
          cd build && zip -r Mush8.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
