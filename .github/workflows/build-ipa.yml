
name: Build Mush8 iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        shell: bash
        run: |
          set -euo pipefail

          XCODE="$(find /Applications -maxdepth 1 \
            -name 'Xcode_16*.app' -print -quit)"

          if [ -z "$XCODE" ]; then
            echo "Xcode 16 not found!"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Configure iOS SDK and compilers
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          CXX="$(xcrun --sdk iphoneos --find clang++)"
          AR="$(xcrun --find ar)"

          {
            echo "SDKROOT=$SDK"
            echo "IPHONEOS_DEPLOYMENT_TARGET=16.0"

            echo "CC=$CC"
            echo "CXX=$CXX"
            echo "AR=$AR"

            echo "CC_aarch64_apple_ios=$CC"
            echo "CXX_aarch64_apple_ios=$CXX"
            echo "AR_aarch64_apple_ios=$AR"

            echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=$CC"

            echo "CMAKE_SYSTEM_NAME=iOS"
            echo "CMAKE_OSX_SYSROOT=$SDK"
            echo "CMAKE_OSX_ARCHITECTURES=arm64"
            echo "CMAKE_OSX_DEPLOYMENT_TARGET=16.0"
            echo "CMAKE_IOS_INSTALL_COMBINED=NO"
          } >> "$GITHUB_ENV"

          xcodebuild -version
          echo "SDK: $SDK"

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios

      - name: Install CMake
        run: brew install cmake

      - name: Build for iOS
        shell: bash
        run: |
          set -euo pipefail

          cargo build \
            --locked \
            --release \
            --target aarch64-apple-ios
