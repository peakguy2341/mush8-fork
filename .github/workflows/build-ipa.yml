name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen

      - name: Run Build and Dynamic Asset Generator
        run: |
          # 1. Compile the main Rust translation modules natively
          cargo build --release --target aarch64-apple-ios
          
          # 2. Replicate what make-ios.sh does to create the missing resource folders
          mkdir -p ios-res/modules
          mkdir -p ios-res/shaders
          cp target/aarch64-apple-ios/release/libnxpatch.a ios-res/modules/ || true
          
          # 3. Generate the native Xcode configuration project safely
          xcodegen generate --spec ios/project.yml

      - name: Build App via Xcode (Completely Skip Signing)
        run: |
          xcodebuild -project ios/Mush8.xcodeproj \
            -scheme Mush8 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build

      - name: Package App into Real IPA
        run: |
          mkdir -p build/Payload
          # Locates and copies the compiled .app payload binary
          cp -r build_output/Build/Products/Release-iphoneos/Mush8.app build/Payload/
          cd build && zip -r Mush8.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
