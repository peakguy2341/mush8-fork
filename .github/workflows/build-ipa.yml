name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen

      - name: Compile and Force Build
        run: |
          chmod +x ./make-ios.sh
          # Runs the full official generator pipeline but catches the signing gate exit code
          ./make-ios.sh --ipa || true

      - name: Manual Fallback Package
        run: |
          # If the script stopped before zipping due to signing, manually grab the built binary
          mkdir -p build/Payload
          cp -r ios/build/Release-iphoneos/Mush8.app build/Payload/ || cp -r build/Mush8.app build/Payload/ || true
          cd build && zip -r Mush8.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
