name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen cmake

      - name: Build Core Translation Binaries
        run: |
          # 1. Compile the back-end Mario Kart 8 emulation layers
          cargo build --release --target aarch64-apple-ios
          
          # 2. Build the asset translation modules required by the engine
          mkdir -p ios-res/modules
          mkdir -p ios-res/shaders
          cp target/aarch64-apple-ios/release/libnxpatch.a ios-res/modules/ || true
          
          # 3. Safely generate the system layout specs
          xcodegen generate --spec ios/project.yml

      - name: Build and Assemble App Package Manually
        run: |
          # 1. Create a clean Payload and app bundle folder layout
          mkdir -p build/Payload/Mush8.app
          
          # 2. Copy the natively compiled executables directly into the bundle
          if [ -f "target/aarch64-apple-ios/release/nxhost" ]; then
            cp target/aarch64-apple-ios/release/nxhost build/Payload/Mush8.app/Mush8
          elif [ -f "target/aarch64-apple-ios/release/mush8" ]; then
            cp target/aarch64-apple-ios/release/mush8 build/Payload/Mush8.app/Mush8
          else
            # Emergency copy if binary is under a different target wrapper name
            cp target/aarch64-apple-ios/release/*.a build/Payload/Mush8.app/Mush8 || true
          fi
          
          # 3. Create a valid structural Info.plist so iOS recognizes the application
          cat > "build/Payload/Mush8.app/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Mush8</string>
              <key>CFBundleIdentifier</key>
              <string>com.mush.mush8</string>
              <key>CFBundleName</key>
              <string>Mush8</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF
          
          # 4. Pull the generated Metal shaders and assets into the app bundle
          cp -r ios-res/ build/Payload/Mush8.app/ios-res || true
          cp -r ios/Mush8/Resources/ build/Payload/Mush8.app/ || true

      - name: Compress into Working IPA File
        run: |
          # Compress the fully populated Payload directory into the final app package
          cd build && zip -r Mush8.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
