name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen cmake

      - name: Run Official Build Script
        run: |
          chmod +x ./make-ios.sh
          # Set the deployment target directly in the environment variables for the build script
          export IPHONEOS_DEPLOYMENT_TARGET=16.0
          ./make-ios.sh --ipa FREE=1 BUNDLE_ID="com.sideload.mush8" || true

      - name: Dynamic Asset Fallback Package
        run: |
          mkdir -p build/Payload
          
          # 1. Look for any valid Compiled application bundle in the workspace
          APP_PATH=$(find . -name "Mush8.app" -type d -not -path "*/build/Payload/*" | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Found compiled app bundle at: $APP_PATH"
            cp -r "$APP_PATH" build/Payload/
            cd build && zip -r Mush8.ipa Payload/
          else
            # 2. Hard emergency assembly if Xcode left loose folders
            echo "Falling back to direct template extraction..."
            mkdir -p build/Payload/Mush8.app
            
            # Find the binary wherever Cargo hid it inside the workspace target tree
            BINARY_PATH=$(find . -type f \( -name "nxhost" -o -name "mush8" \) | head -n 1)
            if [ -n "$BINARY_PATH" ]; then
              cp "$BINARY_PATH" build/Payload/Mush8.app/Mush8
            else
              echo "Error: Crucial compilation executable binary not found anywhere."
              exit 1
            fi
            
            # Write structural layout mapping specs with iOS 16 support indicators
            cat > "build/Payload/Mush8.app/Info.plist" <<'EOF'
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
            <plist version="1.0">
            <dict>
                <key>CFBundleExecutable</key>
                <string>Mush8</string>
                <key>CFBundleIdentifier</key>
                <string>com.sideload.mush8</string>
                <key>CFBundleName</key>
                <string>Mush8</string>
                <key>CFBundlePackageType</key>
                <string>APPL</string>
                <key>CFBundleShortVersionString</key>
                <string>1.0</string>
                <key>CFBundleVersion</key>
                <string>1</string>
                <key>LSRequiresIPhoneOS</key>
                <true/>
                <key>MinimumOSVersion</key>
                <string>16.0</string>
                <key>UIDeviceFamily</key>
                <array>
                    <integer>1</integer>
                    <integer>2</integer>
                </array>
            </dict>
            </plist>
            EOF
            
            cp -r ios-res build/Payload/Mush8.app/ios-res || true
            if [ -d "ios/Mush8/Resources" ]; then cp -r ios/Mush8/Resources/* build/Payload/Mush8.app/ || true; fi
            cd build && zip -r Mush8.ipa Payload/
          fi

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
