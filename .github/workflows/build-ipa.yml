name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    # Upgrades the virtual computer to the latest macOS environment with Xcode 16 pre-installed
    runs-on: macos-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen cmake

      - name: Force Xcode Compilation to Custom Path
        run: |
          # 1. Initialize project directory components cleanly
          mkdir -p target/ios-res/modules
          mkdir -p target/ios-res/shaders
          mkdir -p ios-res/modules
          mkdir -p ios-res/shaders
          
          # 2. Generate native project schema specifications
          xcodegen generate --spec ios/project.yml
          
          # 3. Compile Rust logic dependencies
          cargo build --release --target aarch64-apple-ios || true
          cp target/aarch64-apple-ios/release/libnxpatch.a ios-res/modules/ || true

          # 4. Compile application data layouts using native Xcode 16 toolchains
          export IPHONEOS_DEPLOYMENT_TARGET=16.0
          xcodebuild -project ios/Mush8.xcodeproj \
            -scheme Mush8 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath custom_output_dir \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build || true

      - name: Extract App Package Natively
        run: |
          mkdir -p build/Payload
          
          # Isolate the generated build folder from custom compilation trees
          if [ -d "custom_output_dir/Build/Products/Release-iphoneos/Mush8.app" ]; then
            echo "Successfully isolated Xcode compilation bundle folder structure!"
            cp -r custom_output_dir/Build/Products/Release-iphoneos/Mush8.app build/Payload/
          else
            echo "Scanning build cache structures..."
            APP_PATH=$(find custom_output_dir -name "Mush8.app" -type d | head -n 1)
            cp -r "$APP_PATH" build/Payload/
          fi
          
          # Zip the populated layout tree structure cleanly into your ready-to-sign container
          cd build && zip -r Mush8.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
