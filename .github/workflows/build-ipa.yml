name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen

      - name: Manual Build and Package
        run: |
          # 1. Compile the backend dependencies
          cargo build --release --target aarch64-apple-ios
          
          # 2. Generate the native Xcode project file
          xcodegen generate --spec ios/project.yml
          
          # 3. Compile the iOS App binary while completely disabling signing
          xcodebuild -project ios/Mush8.xcodeproj \
                     -scheme Mush8 \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     clean build
                     
          # 4. Package into an unsigned .ipa folder structure
          mkdir -p build/Payload
          cp -r ios/build/Release-iphoneos/Mush8.app build/Payload/
          cd build && zip -r Mush8.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
