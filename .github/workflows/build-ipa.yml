name: Build Native Mario Kart 8 (Mush8)

on:
  workflow_dispatch:

jobs:
  build-mush8-ipa:
    runs-on: macos-latest
    
    steps:
      # 1. Pull down the official mush8 engine codebase
      - name: Checkout Mush8
        uses: actions/checkout@v4
        with:
          repository: 'c22dev/mush8'
          ref: 'main'

      # 2. Set up the Rust ecosystem
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # 3. Bring in development packages and the Apple Metal shader toolchain
      - name: Install System Dependencies
        run: |
          brew install libarchive cmake pkg-config
          sudo xcodebuild -downloadComponent MetalToolchain || true

      # 4. Reconstruct your encryption keys from Secrets
      - name: Setup Keys
        run: |
          mkdir -p ~/Library/Application\ Support/Ryujinx/system/
          cat << 'EOF' > ~/Library/Application\ Support/Ryujinx/system/prod.keys
          ${{ secrets.PROD_KEYS }}
          EOF
          
          if [ ! -s ~/Library/Application\ Support/Ryujinx/system/prod.keys ]; then
            echo "::error:: prod.keys is missing or empty! Double check your GitHub Secrets."
            exit 1
          fi

      # 5. Download and extract your prepared game assets
      - name: Fetch and Extract Game Assets
        run: |
          mkdir -p game_data
          # REPLACE THIS URL with your direct, raw download link from your file host
          curl -L -o game_data/mk8_dump.zip "https://your-private-storage.com"
          
          # Unzip the content
          unzip -q game_data/mk8_dump.zip -d game_data/extracted/
          
          # Sanity check: Ensure exefs and romfs exist in the directory structure
          echo "Verifying extracted files..."
          ls -R game_data/extracted/
          
          if [ ! -d "game_data/extracted/exefs" ] && [ ! -d "game_data/extracted/*/exefs" ]; then
            echo "::error:: Game files are not in the correct format! Need 'exefs' and 'romfs'."
            exit 1
          fi

      # 6. Run the native packaging command optimized for ESign
      - name: Build Unsigned IPA
        run: |
          chmod +x ./make-ios.sh
          # Pure IPA creation tool. ESign will inject the mobileprovision on-device later.
          ./make-ios.sh --ipa || exit 1

      # 7. Rigidly verify the IPA bundle inside the build folder before wrapping up
      - name: Validate Output Payload
        run: |
          if [ ! -f "build/Mush8.ipa" ]; then
            echo "::error:: The compiler finished but build/Mush8.ipa was not generated!"
            exit 1
          fi
          echo "Build successful! Package size details:"
          ls -lh build/

      # 8. Deliver the working, compiled package
      - name: Upload Mush8 App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: working-mush8-ios-build
          path: build/Mush8.ipa
          retention-days: 3
