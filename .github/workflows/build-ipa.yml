name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen cmake

      - name: Run Official Build Script
        run: |
          chmod +x ./make-ios.sh
          export IPHONEOS_DEPLOYMENT_TARGET=16.0
          ./make-ios.sh --ipa FREE=1 BUNDLE_ID="com.sideload.mush8" || true

      - name: Package Compiled App Into IPA
        run: |
          # 1. Create a fresh payload workspace folder layout
          mkdir -p build/Payload
          
          # 2. Automatically locate the generated app folder components
          APP_PATH=$(find /Users/runner/work -name "Mush8.app" -type d | head -n 1)
          
          if [ -n "$APP_PATH" ]; then
            echo "Found complete compiled app bundle at: $APP_PATH"
            cp -r "$APP_PATH" build/Payload/
            cd build && zip -r Mush8.ipa Payload/
          else
            # Emergency copy if it was generated inside the ios/ directory
            cp -r ios/build/Release-iphoneos/Mush8.app build/Payload/ || true
            cd build && zip -r Mush8.ipa Payload/
          fi

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
