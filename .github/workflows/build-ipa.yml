# setup
name: Mush8 iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select installed Xcode
        shell: bash
        run: |
          set -euo pipefail

          XCODE="$(find /Applications -maxdepth 1 \
            -name 'Xcode_26*.app' -print | sort -V | tail -1)"

          if [ -z "$XCODE" ]; then
            XCODE="/Applications/Xcode.app"
          fi

          if [ ! -d "$XCODE/Contents/Developer" ]; then
            echo "No suitable Xcode installation found!"
            ls -d /Applications/Xcode*.app
            exit 1
          fi

          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Configure Apple SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          CXX="$(xcrun --sdk iphoneos --find clang++)"

          {
            echo "SDKROOT=$SDK"
            echo "IPHONEOS_DEPLOYMENT_TARGET=16.0"

            echo "CC=$CC"
            echo "CXX=$CXX"

            echo "CC_aarch64_apple_ios=$CC"
            echo "CXX_aarch64_apple_ios=$CXX"

            echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=$CC"

            echo "CMAKE_OSX_SYSROOT=$SDK"
            echo "CMAKE_OSX_ARCHITECTURES=arm64"
            echo "CMAKE_OSX_DEPLOYMENT_TARGET=16.0"
          } >> "$GITHUB_ENV"

          echo "Selected SDK: $SDK"
          xcodebuild -version

      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Install CMake
        run: brew install cmake

      - name: Create CMake toolchain
        shell: bash
        run: |
          mkdir -p .github/toolchains

          cat > .github/toolchains/ios.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME iOS)

          set(CMAKE_OSX_SYSROOT "$ENV{SDKROOT}"
              CACHE PATH "" FORCE)

          set(CMAKE_OSX_ARCHITECTURES arm64
              CACHE STRING "" FORCE)

          set(CMAKE_OSX_DEPLOYMENT_TARGET 16.0
              CACHE STRING "" FORCE)

          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          EOF

          echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/.github/toolchains/ios.cmake" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          echo "Developer: $DEVELOPER_DIR"
          echo "SDK: $SDKROOT"

          test -d "$DEVELOPER_DIR"
          test -d "$SDKROOT"

          xcrun --sdk iphoneos --show-sdk-version
          rustc +1.98.1 --version
          cmake --version

      - name: Build Mush8
        run: |
          cargo +1.98.1 build \
            --locked \
            --release \
            --target aarch64-apple-ios
