name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen

      - name: Compile and Force Build
        run: |
          chmod +x ./make-ios.sh
          # Runs the full compilation but bypasses the final script exit code error
          ./make-ios.sh --ipa || true

      - name: Manual Fallback Package
        run: |
          # 1. Create a fresh Payload folder
          mkdir -p build/Payload
          
          # 2. Grab the actual compiled app from the build folder and move it to Payload
          cp -r build/Mush8.app build/Payload/
          
          # 3. Zip it into a real, non-empty IPA file
          cd build && zip -r Mush8.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
