name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen cmake

      - name: Run Direct Binary Compilation
        run: |
          # Compiles the actual Mario Kart recompiled binaries directly
          cargo build --release --target aarch64-apple-ios

      - name: Manual Assembly of Mush8 App Bundle
        run: |
          # 1. Replicate a standard iOS application payload tree structure
          mkdir -p build/Payload/Mush8.app
          
          # 2. Extract the compiled executable output binary from target paths
          # Mush8 uses either nxhost or mush8 as its binary output targets
          if [ -f "target/aarch64-apple-ios/release/nxhost" ]; then
            cp target/aarch64-apple-ios/release/nxhost build/Payload/Mush8.app/Mush8
          elif [ -f "target/aarch64-apple-ios/release/mush8" ]; then
            cp target/aarch64-apple-ios/release/mush8 build/Payload/Mush8.app/Mush8
          else
            echo "Searching for executable..."
            find target/aarch64-apple-ios/release/ -maxdepth 1 -type f -not -name "*.a" -not -name "*.d" -exec cp {} build/Payload/Mush8.app/Mush8 \;
          fi
          
          # 3. Write a bare-bones Info.plist so your iOS device reads it natively
          cat > "build/Payload/Mush8.app/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Mush8</string>
              <key>CFBundleIdentifier</key>
              <string>com.sideload.mush8</string>
              <key>CFBundleName</key>
              <string>Mush8</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF
          
          # 4. Pull down the essential dynamic project assets and configurations
          if [ -d "ios/Mush8/Resources" ]; then
            cp -r ios/Mush8/Resources/* build/Payload/Mush8.app/ || true
          fi
          
          # 5. Compress everything down securely into your working IPA file
          cd build && zip -r Mush8.ipa Payload/

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
