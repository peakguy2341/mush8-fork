# setup
name: Mush8 iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select installed Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          XCODE="$(find /Applications -maxdepth 1 \
            -name 'Xcode_26*.app' -print | sort -V | tail -1)"

          if [ -z "$XCODE" ]; then
            XCODE="/Applications/Xcode.app"
          fi

          if [ ! -d "$XCODE/Contents/Developer" ]; then
            echo "Xcode installation not found!"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi

          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Configure Apple SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos --find clang)"
          CXX="$(xcrun --sdk iphoneos --find clang++)"
          AR="$(xcrun --find ar)"

          {
            echo "SDKROOT=$SDK"
            echo "CC=$CC"
            echo "CXX=$CXX"
            echo "AR=$AR"

            echo "CC_aarch64_apple_ios=$CC"
            echo "CXX_aarch64_apple_ios=$CXX"
            echo "AR_aarch64_apple_ios=$AR"

            echo "CARGO_TARGET_AARCH64_APPLE_IOS_LINKER=$CC"

            echo "CMAKE_OSX_SYSROOT=$SDK"
            echo "CMAKE_OSX_ARCHITECTURES=arm64"
          } >> "$GITHUB_ENV"

          xcodebuild -version
          echo "iOS SDK: $SDK"

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Install build dependencies
        run: |
          brew install cmake pkgconf xcodegen

      - name: Create CMake toolchain
        shell: bash
        run: |
          mkdir -p .github/toolchains

          cat > .github/toolchains/ios.cmake <<'EOF'
          set(CMAKE_SYSTEM_NAME iOS)

          set(CMAKE_OSX_SYSROOT "$ENV{SDKROOT}"
              CACHE PATH "" FORCE)

          set(CMAKE_OSX_ARCHITECTURES arm64
              CACHE STRING "" FORCE)

          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          EOF

          echo "CMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/.github/toolchains/ios.cmake" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          echo "Developer: $DEVELOPER_DIR"
          echo "SDK: $SDKROOT"

          test -d "$DEVELOPER_DIR"
          test -d "$SDKROOT"

          xcrun --sdk iphoneos --show-sdk-version
          rustc +1.98.1 --version
          cmake --version
          xcodegen --version

      - name: Build and package Mush8 IPA
        shell: bash
        run: |
          set -euo pipefail

          chmod +x ./make-ios.sh

          ./make-ios.sh --ipa

          test -f build/Mush8.ipa

          echo "IPA successfully created!"

      - name: Upload Mush8 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
          retention-days: 7
