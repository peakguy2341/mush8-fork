name: Mush8 iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 \
            -name 'Xcode_26*.app' | sort -V | tail -1)

          if [ -z "$XCODE" ]; then
            XCODE="/Applications/Xcode.app"
          fi

          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install cmake pkgconf xcodegen

      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Check build inputs
        run: |
          echo "Checking repository..."
          ls -la
          echo "Checking game input files..."
          for f in prod.keys base.nsp upd4-0-1.nsp; do
            if [ -f "$f" ]; then
              echo "Found: $f"
            else
              echo "Missing: $f"
            fi
          done

      - name: Build IPA with detailed logging
        run: |
          mkdir -p build
          chmod +x ./make-ios.sh

          set +e
          bash -x ./make-ios.sh --ipa 2>&1 | tee build/full-build.log
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "Build script exit code: $STATUS"
          echo "Searching for IPA..."
          find . -type f -name "*.ipa" -print

          exit "$STATUS"

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: "**/*.ipa"
          if-no-files-found: error
          retention-days: 7

      - name: Upload complete logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-Full-Build-Logs
          path: build/full-build.log
          if-no-files-found: ignore
          retention-days: 7
