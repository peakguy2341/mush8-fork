name: Mush8 iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      CARGO_BUILD_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      RUST_BACKTRACE: full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(find /Applications -maxdepth 1 \
            -name 'Xcode_26*.app' | sort -V | tail -1)

          if [ -z "$XCODE" ]; then
            echo "ERROR: Xcode 26 not found."
            exit 1
          fi

          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Install dependencies
        run: |
          brew install cmake pkgconf xcodegen

      - name: Verify environment
        run: |
          xcodebuild -version
          rustc +1.98.1 --version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version

      - name: Check game data
        run: |
          set -e

          echo "Checking required game data..."

          for file in prod.keys base.nsp upd4-0-1.nsp; do
            if [ ! -s "$file" ]; then
              echo "Missing or empty input: $file"
              exit 1
            fi
          done

          if [ ! -d Firmware ]; then
            echo "Missing Firmware folder."
            exit 1
          fi

          echo "Required inputs found."

      - name: Prepare update filename
        run: |
          set -e

          if [ ! -e update.nsp ]; then
            ln -s "$PWD/upd4-0-1.nsp" update.nsp
          fi

          test -s update.nsp

      - name: Build Mush8 IPA
        run: |
          set -o pipefail
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa 2>&1 | tee build.log

      - name: Validate IPA archive
        run: |
          set -e

          IPA="build/Mush8.ipa"

          if [ ! -s "$IPA" ]; then
            echo "ERROR: IPA missing or empty."
            exit 1
          fi

          unzip -t "$IPA"

          mkdir -p ipa-check
          unzip -q "$IPA" -d ipa-check

          APP="ipa-check/Payload/Mush8.app"

          test -d "$APP"
          test -s "$APP/Info.plist"

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" "$APP/Info.plist")

          test -s "$APP/$EXECUTABLE"

          echo "IPA VALIDATION PASSED"
          echo "Executable: $EXECUTABLE"
          du -h "$APP/$EXECUTABLE"
          du -h "$IPA"

      - name: Upload Mush8 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
