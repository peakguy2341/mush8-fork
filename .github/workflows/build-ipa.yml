name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          # Both tools are strictly required for the script to finish
          brew install xcodegen cmake

      - name: Run Official Build Script
        run: |
          chmod +x ./make-ios.sh
          # FREE=1 tells the project to strip premium Apple Developer certificate demands
          ./make-ios.sh --ipa FREE=1 BUNDLE_ID="com.sideload.mush8"

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
