name: Mush8 iOS IPA Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    env:
      CARGO_BUILD_JOBS: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      RUST_BACKTRACE: full

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -e

          XCODE=$(find /Applications -maxdepth 1 \
            -name 'Xcode_26*.app' | sort -V | tail -1)

          if [ -z "$XCODE" ]; then
            echo "ERROR: Xcode 26 not found."
            exit 1
          fi

          sudo xcode-select -s "$XCODE/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Install dependencies
        run: |
          brew install cmake pkgconf xcodegen

      - name: Install Metal Toolchain
        run: |
          xcodebuild -downloadComponent MetalToolchain

      - name: Verify environment
        run: |
          xcodebuild -version
          rustc +1.98.1 --version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version
          xcodegen --version

      - name: Check build inputs
        run: |
          set -e

          if [ ! -s "base.nsp" ]; then
            echo "ERROR: base.nsp is missing or empty."
            exit 1
          fi

          if [ -s "upd4-0-1.nsp" ]; then
            echo "Found update 4.0.1."
          elif [ -s "update.nsp" ]; then
            echo "Found update.nsp."
          else
            echo "ERROR: No supported update file found."
            exit 1
          fi

          echo "Build inputs passed."

      - name: Build Mush8 IPA
        run: |
          set -o pipefail
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa 2>&1 | tee build.log

      - name: Validate IPA
        run: |
          set -e

          IPA="build/Mush8.ipa"

          if [ ! -s "$IPA" ]; then
            echo "ERROR: IPA missing or empty."
            exit 1
          fi

          unzip -t "$IPA"

          mkdir -p ipa-check
          unzip -q "$IPA" -d ipa-check

          APP="ipa-check/Payload/Mush8.app"

          if [ ! -d "$APP" ]; then
            echo "ERROR: Mush8.app missing."
            exit 1
          fi

          if [ ! -s "$APP/Info.plist" ]; then
            echo "ERROR: Info.plist missing or empty."
            exit 1
          fi

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" "$APP/Info.plist")

          if [ ! -s "$APP/$EXECUTABLE" ]; then
            echo "ERROR: App executable missing or empty."
            exit 1
          fi

          echo "IPA VALIDATION PASSED"
          echo "Executable: $EXECUTABLE"

          du -h "$APP/$EXECUTABLE"
          du -h "$IPA"

      - name: Upload Mush8 IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-Build-Logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
