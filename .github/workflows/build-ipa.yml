name: Build Mush8 IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
          rustup default 1.98.1

      - name: Install Tools via Homebrew
        run: |
          brew install xcodegen cmake

      - name: Compile and Force Build
        run: |
          chmod +x ./make-ios.sh
          ./make-ios.sh --ipa || true

      - name: Manual Fallback Package
        run: |
          # 1. Recreate the precise folder structure for an iOS app bundle manually
          mkdir -p build/Payload/Mush8.app
          
          # 2. Copy the natively compiled executable binary into the bundle
          cp target/aarch64-apple-ios/release/mush8 build/Payload/Mush8.app/Mush8 || cp target/aarch64-apple-ios/release/libnxpatch.a build/Payload/Mush8.app/Mush8 || true
          
          # 3. Copy the manifest file and standard asset properties from the repository
          cp ios/Mush8/Info.plist build/Payload/Mush8.app/Info.plist || cp Info.plist build/Payload/Mush8.app/Info.plist || true
          
          # 4. Pull the generated shaders/resource modules into the folder structure
          cp -r ios-res build/Payload/Mush8.app/ios-res || true
          
          # 5. Compress everything into your final working IPA file
          cd build && zip -r Mush8.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
